<h3>Manage Carousel Images</h3>

<div *ngFor="let img of carouselImages; let i = index" class="mb-3">
  <img [src]="img.url" class="img-thumbnail" width="200">
  <input type="file" (change)="onFileSelected($event, i)">
  <button class="btn btn-danger btn-sm ms-2" (click)="deleteImage(i)">Delete</button>
</div>

<hr>
<input type="file" (change)="addImage($event)" class="mt-3">


  <button (click)="saveImage()" class="btn btn-primary">Save Image</button>
