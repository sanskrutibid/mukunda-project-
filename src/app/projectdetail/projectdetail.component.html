<section  
  id="home"  
  class="banner-wrapper position-relative"  
  [ngStyle]="{  
    'background-image': 'url(assets/images/image/carousel-3.jpg)'  
  }"  
>  

  <!-- Dark overlay -->  
  <div class="banner-overlay position-absolute top-0 start-0 w-100 h-100"></div>  

  <div class="container position-relative">  

    <div class="row" data-aos="fade-left">  

      <div class="col-sm-12 text-center text-md-start">  

        <h1  
          class="text-white m-2 p-2 fw-bold text-center text-uppercase banner-heading"  
        >  
          Welcome to Projects  
        </h1>  

      </div>  

    </div>  

  </div>  

</section>  

<!-- Karmabhoomi -->  
<section  
  id="Karmabhoomi"  
  class="project-section py-5"  
  data-aos="fade-up"  
>  

  <div class="container">  

    <div class="row align-items-center flex-lg-row-reverse">  

      <!-- Image Section on Right -->  
      <div class="col-lg-7 px-0">  

        <img  
          src="assets/images/image/karma2.PNG"  
          class="img-fluid w-100 object-fit-cover rounded-4 shadow-sm"  
          alt="Commercial land for sale in Nagpur - industrial development project in Nagpur"  
          loading="lazy"  
        />  

      </div>  

      <!-- Content Section on Left -->  
      <div class="col-lg-5 p-5">  

        <h2 class="fw-bold mb-4 text-dark">  
          Karmabhoomi  
        </h2>  

        <ul class="list-unstyled">  

          <li class="mb-3 d-flex align-items-center fs-5">  

            <fa-icon  
              [icon]="faRulerCombined"  
              class="text-danger me-3"  
            ></fa-icon>  

            <strong>40 Acres</strong> – Project Size  

          </li>  

          <li class="mb-3 d-flex align-items-center fs-5">  

            <fa-icon  
              [icon]="faIndustry"  
              class="text-danger me-3"  
            ></fa-icon>  

            <span>  
              <strong>10+ Amenities</strong> – Amenity Space, Walking Trial,  
              Lawn, Heavy Vehicle Parking  
            </span>  

          </li>  

          <li class="mb-3 d-flex align-items-center fs-5">  

            <fa-icon  
              [icon]="faMapMarkerAlt"  
              class="text-danger me-3"  
            ></fa-icon>  

            <strong>Mahalgaon</strong> – Location  

          </li>  

        </ul>  

        <a  
          routerLink="/karmabhumi"  
          routerLinkActive="active"  
          class="btn btn-outline-dark rounded-pill"  
        >  
          View Project  
        </a>  

      </div>  

    </div>  

  </div>  

</section>
