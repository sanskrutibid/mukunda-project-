<h4>Update Vimeo Video URL</h4>
<input type="text" class="form-control" placeholder="Paste Vimeo embed URL here" [(ngModel)]="videoUrl">
<button class="btn btn-primary mt-2" (click)="saveVideoUrl()">Save Video</button>

<div class="mt-3 ratio ratio-16x9" *ngIf="previewUrl">
  <iframe [src]="previewUrl | safeUrl" frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen></iframe>
</div>
